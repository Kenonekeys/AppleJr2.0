<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AppleJr — Sideloading & Guides</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --bg: #0b0c10;
  --panel: #14151c;
  --accent: #4aa3ff;
  --text: #f5f5f7;
  --muted: #9fa3b7;
  --radius: 18px;
  --border: #1f2029;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, system-ui;
  background: var(--bg);
  color: var(--text);
}

/* HEADER */
header {
  padding: 20px;
  text-align: center;
}

header h1 {
  font-size: 36px;
  font-weight: 700;
  color: var(--accent);
}

header p {
  color: var(--muted);
  font-size: 14px;
}

/* MAIN */
main {
  max-width: 900px;
  margin: 0 auto;
  padding: 20px;
}

/* BUTTON GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
  margin-top: 30px;
}

.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  text-align: center;
  cursor: pointer;
  transition: 0.2s;
}

.card:hover {
  transform: translateY(-4px);
  border-color: var(--accent);
}

/* ICON */
.icon {
  width: 60px;
  height: 60px;
  margin: 0 auto 12px;
  border-radius: 16px;
  background: conic-gradient(from 210deg, #4aa3ff, #7bffb8, #ffd54a, #4aa3ff);
  display: flex;
  justify-content: center;
  align-items: center;
  font-weight: 800;
  font-size: 22px;
  color: #0b0c10;
  box-shadow: 0 0 0 2px #0b0c10, 0 10px 25px rgba(0,0,0,0.6);
}

.icon::before {
  content: "";
  position: absolute;
  width: 40px;
  height: 40px;
  border-radius: 12px;
  border: 2px solid rgba(5,5,9,0.35);
  transform: rotate(8deg);
}

/* FOOTER */
footer {
  text-align: center;
  padding: 30px;
  color: var(--muted);
  font-size: 13px;
}
</style>
</head>

<body>

<header>
  <h1>AppleJr</h1>
  <p>Your home for sideloading, guides, and iOS tools.</p>
</header>

<main>

  <div class="grid">

    <!-- Sideloading -->
    <div class="card" onclick="window.open('https://sideload.applejr.net', '_blank')">
      <div class="icon">SL</div>
      <h2>Sideloading</h2>
      <p>Install apps through AppleJr’s sideloading service.</p>
    </div>

    <!-- AppleJr Guides -->
    <div class="card" onclick="window.open('https://applejr.net', '_blank')">
      <div class="icon" style="background: radial-gradient(circle at top left, #fff, var(--accent));">AJ</div>
      <h2>Guides</h2>
      <p>Learn how to sideload, troubleshoot, and optimize iOS.</p>
    </div>

    <!-- AppleJr OS -->
    <div class="card" onclick="window.open('https://kenonekeys.github.io/AppleJr2.0/', '_blank')">
      <div class="icon" style="background: linear-gradient(135deg, #4aa3ff, #1f6fff);">OS</div>
      <h2>AppleJr OS</h2>
      <p>Launch the web‑based desktop environment.</p>
    </div>

  </div>

</main>

<footer>
  AppleJr © 2026 — Built for iOS users.
</footer>

</body>
</html>
