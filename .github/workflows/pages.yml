name: Deploy Website (Multi‑Runner)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    strategy:
      fail-fast: false
      matrix:
        runner: 
          - ubuntu-latest
          - ubuntu-24.04
          - ubuntu-22.04
          - macos-latest
          - macos-15
          - macos-14
          - macos-13
          - windows-latest
          - windows-2022
          - windows-2019
          - ubuntu-latest-arm64
          - ubuntu-24.04-arm64
          - ubuntu-22.04-arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  publish:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Publish
        uses: actions/deploy-pages@v4
