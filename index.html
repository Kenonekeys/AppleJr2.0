<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AppleJr 2.0</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --bg: #050509;
  --panel: #11121a;
  --accent: #4aa3ff;
  --accent-soft: #4aa3ff22;
  --text: #f5f5f7;
  --muted: #9fa3b7;
  --border: #262838;
  --radius-lg: 18px;
  --radius-md: 12px;
  --radius-sm: 8px;
  --shadow-soft: 0 18px 40px rgba(0,0,0,0.55);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, system-ui, sans-serif;
  background: #000;
  color: var(--text);
  overflow: hidden;
}

/* BOOT */
#boot {
  position: fixed;
  inset: 0;
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  gap: 20px;
  z-index: 9999;
  animation: bootFade 2.5s forwards;
}

@keyframes bootFade {
  0% { opacity: 1; }
  70% { opacity: 1; }
  100% { opacity: 0; visibility: hidden; }
}

.boot-logo {
  font-size: 42px;
  font-weight: 700;
  color: var(--accent);
}

.boot-sub {
  color: var(--muted);
  font-size: 14px;
}

/* DESKTOP */
#desktop {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at top, #1b1c26 0, #05060a 55%, #000 100%);
  padding: 20px;
  display: flex;
  flex-direction: column;
}

/* TOPBAR */
.topbar {
  height: 32px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: var(--muted);
  font-size: 13px;
  padding: 0 12px;
}

/* LAUNCHER GRID */
.launcher {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 16px;
  padding: 20px;
}

.app {
  background: #181927;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  padding: 12px;
  text-align: center;
  cursor: pointer;
  transition: 0.15s;
}

.app:hover {
  transform: translateY(-3px);
  border-color: var(--accent);
  background: #1c1d2b;
}

/* ICONS */
.app-icon {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: radial-gradient(circle at top left, #fff, var(--accent));
  margin: 0 auto 8px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-weight: 700;
  color: #000;
}

/* Custom SL icon */
.app-icon-sl {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: conic-gradient(from 210deg, #4aa3ff, #7bffb8, #ffd54a, #4aa3ff);
  margin: 0 auto 8px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-weight: 800;
  color: #050509;
  box-shadow: 0 0 0 2px #050509, 0 10px 25px rgba(0,0,0,0.6);
}

/* subtle cube feel */
.app-icon-sl::before {
  content: "";
  position: absolute;
  width: 26px;
  height: 26px;
  border-radius: 8px;
  border: 2px solid rgba(5,5,9,0.35);
  transform: rotate(8deg);
}

/* label */
.app-title {
  font-size: 14px;
  font-weight: 600;
}

.app-desc {
  font-size: 11px;
  color: var(--muted);
  margin-top: 4px;
}

/* DOCK */
.dock {
  height: 70px;
  background: #11121a88;
  backdrop-filter: blur(12px);
  border-radius: 20px;
  border: 1px solid var(--border);
  margin: 0 auto;
  width: 90%;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 22px;
}

.dock-icon {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  background: radial-gradient(circle at top left, #fff, var(--accent));
  display: flex;
  justify-content: center;
  align-items: center;
  font-weight: 700;
  color: #000;
  cursor: pointer;
  transition: 0.15s;
}

.dock-icon:hover {
  transform: translateY(-4px);
}

/* WINDOWS */
.window {
  position: fixed;
  top: 60px;
  left: 50%;
  transform: translateX(-50%);
  width: 80%;
  max-width: 900px;
  height: 70%;
  background: #14151c;
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-soft);
  display: none;
  flex-direction: column;
}

.window-header {
  height: 40px;
  display: flex;
  align-items: center;
  padding: 0 12px;
  border-bottom: 1px solid var(--border);
}

.window-title {
  flex: 1;
  font-size: 14px;
  color: var(--muted);
}

.close-btn {
  width: 14px;
  height: 14px;
  background: #ff5f57;
  border-radius: 50%;
  cursor: pointer;
}

.window-body {
  padding: 16px;
  overflow-y: auto;
  font-size: 14px;
}

/* TOAST */
.toast {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #14151f;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  padding: 10px 12px;
  font-size: 12px;
  color: var(--muted);
  opacity: 0;
  transform: translateY(8px);
  transition: 0.2s;
}

.toast.visible {
  opacity: 1;
  transform: translateY(0);
}
</style>
</head>

<body>

<!-- BOOT -->
<div id="boot">
  <div class="boot-logo">AppleJr 2.0</div>
  <div class="boot-sub">Booting web OS…</div>
</div>

<!-- DESKTOP -->
<div id="desktop">

  <div class="topbar">
    <div>AppleJr OS</div>
    <div id="clock"></div>
  </div>

  <div class="launcher">

    <!-- Existing apps (example) -->
    <div class="app" data-window="win-applejr">
      <div class="app-icon">AJ</div>
      <div class="app-title">AppleJr</div>
      <div class="app-desc">Guides & tutorials</div>
    </div>

    <!-- NEW: Sideloading button -->
    <div class="app" onclick="window.open('https://sideload.applejr.net', '_blank')">
      <div class="app-icon-sl">SL</div>
      <div class="app-title">Sideloading</div>
      <div class="app-desc">Install apps via AppleJr</div>
    </div>

  </div>

  <div class="dock">
    <!-- Example dock icons -->
    <div class="dock-icon" data-window="win-about">?</div>

    <!-- Optional: Sideloading in dock too -->
    <div class="dock-icon" onclick="window.open('https://sideload.applejr.net', '_blank')">
      SL
    </div>
  </div>

</div>

<!-- WINDOWS -->
<div class="window" id="win-applejr">
  <div class="window-header">
    <div class="window-title">AppleJr</div>
    <div class="close-btn"></div>
  </div>
  <div class="window-body">
    <p>Official AppleJr guides:</p>
    <p><a href="https://applejr.net" target="_blank">Open AppleJr</a></p>
  </div>
</div>

<div class="window" id="win-about">
  <div class="window-header">
    <div class="window-title">About AppleJr OS</div>
    <div class="close-btn"></div>
  </div>
  <div class="window-body">
    <p>AppleJr 2.0 — web desktop for iOS sideloading & guides.</p>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast">Window opened</div>

<script>
/* CLOCK */
setInterval(() => {
  document.getElementById("clock").textContent =
    new Date().toLocaleTimeString();
}, 1000);

/* OPEN WINDOWS */
document.querySelectorAll(".app[data-window], .dock-icon[data-window]").forEach(el => {
  el.onclick = () => {
    const id = el.dataset.window;
    if (!id) return;
    document.getElementById(id).style.display = "flex";
    showToast("Opened " + id.replace("win-", ""));
  };
});

/* CLOSE WINDOWS */
document.querySelectorAll(".close-btn").forEach(btn => {
  btn.onclick = () => {
    btn.closest(".window").style.display = "none";
  };
});

/* TOAST */
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("visible");
  setTimeout(() => t.classList.remove("visible"), 2500);
}
</script>

</body>
</html>
