name: Auto Deploy Website (No Queue)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  publish:
    needs: deploy
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Publish
        uses: actions/deploy-pages@v4
