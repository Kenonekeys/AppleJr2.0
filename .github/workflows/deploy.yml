name: Auto Deploy Website (Extreme Runners)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    strategy:
      fail-fast: false
      matrix:
        runner:
          # Ubuntu (x64 + ARM)
          - ubuntu-latest
          - ubuntu-24.04
          - ubuntu-22.04
          - ubuntu-20.04
          - ubuntu-latest-arm64
          - ubuntu-24.04-arm64
          - ubuntu-22.04-arm64

          # macOS
          - macos-latest
          - macos-15
          - macos-14
          - macos-13

          # Windows
          - windows-latest
          - windows-2022
          - windows-2019

          # Self-hosted (if you ever add your own)
          - self-hosted

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  publish:
    needs: deploy
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Publish
        uses: actions/deploy-pages@v4
