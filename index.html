<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AppleJr — Home</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --bg:#0b0c10; --panel:#14151c; --accent:#4aa3ff;
  --text:#f5f5f7; --muted:#9fa3b7; --border:#1f2029;
  --radius:18px;
}
body { margin:0; font-family:-apple-system; background:var(--bg); color:var(--text); }

/* NAV */
nav {
  display:flex; justify-content:center; gap:20px;
  padding:15px; background:#14151c; border-bottom:1px solid var(--border);
}
nav a {
  color:var(--text); text-decoration:none; font-size:15px;
  padding:8px 14px; border-radius:10px; transition:0.2s;
}
nav a:hover { background:#1f2029; }

/* GRID */
.grid {
  max-width:900px; margin:40px auto; padding:20px;
  display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}
.card {
  background:var(--panel); border:1px solid var(--border);
  border-radius:var(--radius); padding:20px; text-align:center;
  cursor:pointer; transition:0.2s;
}
.card:hover { transform:translateY(-4px); border-color:var(--accent); }

.icon {
  width:60px; height:60px; margin:0 auto 12px;
  border-radius:16px; background:conic-gradient(from 210deg,#4aa3ff,#7bffb8,#ffd54a,#4aa3ff);
  display:flex; justify-content:center; align-items:center;
  font-weight:800; font-size:22px; color:#0b0c10;
}
</style>
</head>

<body>

<nav>
  <a href="index.html">Home</a>
  <a href="projects.html">Projects</a>
  <a href="donate.html">Donate</a>
</nav>

<div class="grid">

  <div class="card" onclick="location.href='projects.html'">
    <div class="icon">PR</div>
    <h2>Projects</h2>
    <p>Explore Fearn, Makinon, AppleJr OS, and more.</p>
  </div>

  <div class="card" onclick="location.href='donate.html'">
    <div class="icon">💙</div>
    <h2>Donate</h2>
    <p>Support AppleJr development.</p>
  </div>

  <div class="card" onclick="location.href='#sideloading'">
    <div class="icon">SL</div>
    <h2>Sideloading</h2>
    <p>Install apps directly on iOS.</p>
  </div>

</div>

</body>
</html>
